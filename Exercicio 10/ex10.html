<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 10 - Login Simples</title>
    <link rel="stylesheet" href="stilo.css">
</head>
<body>
    <main class="container">
        <h1>Login simples</h1>
        <p>Digite o usúario e a senha para testa a validação</p>

        <label for="usuario">Usúario:</label>
        <input type="text" id="senha" placeholder="Digite o usúario">

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite a senha">

        <div class="botoes">
            <button onclick="verificadorLogin()">Entrar</button>
            <button class="secundario" onclick="limparCampos()">Limpar</button>
        </div>

        <p id="resultado">Resultado: </p>
        <p class="dica">Teste com o usuário <strong>aluno</strong> e a senha <strong>1234</strong>.</p>
    </main>
    <script src="script.js"></script>
</body>
</html
